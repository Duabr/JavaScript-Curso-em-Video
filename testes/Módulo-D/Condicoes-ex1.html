<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condições-exercício-1</title>
    <style>
        body {
            background-color: rgb(0, 89, 255);
            font: normal 18pt arial;
        }
        input {
            font: normal 15pt arial;
        }
    </style>
</head>
<body>
    <h1>Verificação de Nacionalidade</h1>
    País de origem: <input type="text" name="nac" id="nac">
    <input type="button" value="verificar" onclick="verificar()">
    <div id="resultado">Você é: </div>
    <script>
        function verificar() {
            var nacionalidade = document.querySelector('input#nac')
            var resultado = document.querySelector('div#resultado')
            if (nacionalidade.value == 'Brasil' || nacionalidade.value == 'brasil') {// É necessário usar ".value" na variável nesse caso, por algum motivo
                resultado.innerHTML = 'Você é: <strong>Brasileiro/a</strong>.'
            } else {
                resultado.innerHTML = 'Você é: <strong>Estrangeiro/a</strong>.'
            }
        }
    </script>
</body>
</html>
