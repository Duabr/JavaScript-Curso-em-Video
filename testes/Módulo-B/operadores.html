<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // O operador Ternário é o único que preciso anotar
        // é basicamente um if com else feito em uma única linha
        // teste ? true : false
        var nota1 = 7
        var nota2 = 2
        var nota3 = 4
        media = (nota1+nota2+nota3)/3
        var resultado = media >= 6 ? "aprovado" : "reprovado"
        document.write(resultado)

    </script>
</body>
</html>
