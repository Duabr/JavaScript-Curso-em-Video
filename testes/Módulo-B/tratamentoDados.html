<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tratamento de Dados</title>
    <style>
        body {
            background-color: rgb(20, 83, 20);
            color: rgb(0, 238, 255);
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <h1>TESTE</h1>
    <p>teste</p>
    <script>
        var n1 = prompt("Número 1: ")// prompt() retorna uma string
        var n2 = prompt("Número 2: ")
        var soma = Number(n1) + Number(n2)// Ou "parseInt(n1)" ou "parseFloat(n1)" 
        document.write(`A soma de ${n1} com ${n2} é igual à ${soma}.<br>`)// É necessário usar crase (``) para usar esses ${}
        var nome = prompt('Nome:')
        document.write(`O nome "<strong>${nome}</strong>" tem: ${nome.length} dígitos.<br>`)
        // Tratamento de números:
        var n3 = 55.3
        n3 = n3.toFixed(2)// Podendo adicionar .replace('.', ',') para usar vírgula ao invés de ponto
        document.write(n3 + '<br>')
        // Um método para formatar um número em dinheiro:
        var n4 = 2099
        n4 = n4.toLocaleString('pt-BR', {style: "currency", currency: 'BRL'})
        document.write(n4)
    </script>
</body>
</html>
