<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analisador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Analisador de números</h1>
    </header>
    <section>
        <div id="input">
            Número (entre 1 e 100): <input type="number" id="num">
            <input type="button" value="adicionarNum" id="adicionarNum" onclick="adicionarNum(document.querySelector('input#num').value)">
        </div>
        <div id="lista">
            <select id="listaNum" size="10"></select>
        </div>
        <div id="output">asda</div>
    </section>
    <footer>
        <p id="autor">&copy; Github: Duabr</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
